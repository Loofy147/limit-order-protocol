name: bounty-native-boundary

on:
  push:
    branches:
      - bounty/research-4.3.4
  pull_request:
    branches:
      - master

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Verify target pin
        run: |
          git fetch --no-tags --unshallow origin
          git merge-base --is-ancestor "7da29889efa2e635611e1caf60f85f595ff7f05f" HEAD
          test "$(node -p "require('./package.json').version")" = "4.3.4"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run native-order boundary test
        run: yarn hardhat test test/BountyNativeOrderBoundary.js

      - name: Run native-order isolation test
        run: yarn hardhat test test/BountyNativeOrderIsolation.js

      - name: Run resolver reward balance test
        run: yarn hardhat test test/BountyResolverRewardBalance.js

      - name: Run undercollateralized resolver reward test
        run: yarn hardhat test test/BountyResolverUndercollateralizedReward.js
